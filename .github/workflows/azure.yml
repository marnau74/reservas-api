name: azure

# Valida la infraestructura (Bicep) en cada cambio y despliega en Azure solo a mano (Actions › azure ›
# Run workflow). El acceso a Azure es por OIDC: no hay credenciales de Azure guardadas en GitHub.
# Pasos para prepararlo, en docs/despliegue-azure.md.

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/azure.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/azure.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compilar y revisar el Bicep
        run: |
          az bicep install
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
          az bicep lint --file infra/azure/main.bicep
      - name: Los parámetros se resuelven (con valores de prueba)
        env:
          IMAGEN_API: ghcr.io/ejemplo/reservas-api:prueba
          POSTGRES_CONTRASENA: contrasena-de-prueba-larga
          JWT_CLAVE: clave-de-prueba-de-al-menos-32-caracteres
          CORREO_AVISOS: avisos@example.com
        run: az bicep build-params --file infra/azure/main.bicepparam --stdout > /dev/null

  desplegar:
    if: github.event_name == 'workflow_dispatch'
    needs: validar
    runs-on: ubuntu-latest
    # El entorno «azure» puede exigir aprobación manual y guarda los secretos del despliegue
    environment: azure
    permissions:
      contents: read
      packages: write # publicar la imagen en GitHub Container Registry
      id-token: write # iniciar sesión en Azure por OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nombre de la imagen
        id: imagen
        run: echo "nombre=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reservas-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.imagen.outputs.nombre }}

      - name: Iniciar sesión en Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar la infraestructura y la API
        id: despliegue
        env:
          IMAGEN_API: ${{ steps.imagen.outputs.nombre }}
          POSTGRES_CONTRASENA: ${{ secrets.POSTGRES_CONTRASENA }}
          JWT_CLAVE: ${{ secrets.JWT_CLAVE }}
          DEMO_CONTRASENA: ${{ secrets.DEMO_CONTRASENA }}
          CORS_ORIGEN: ${{ vars.CORS_ORIGEN }}
          CORREO_AVISOS: ${{ secrets.CORREO_AVISOS }}
        run: |
          url=$(az deployment group create \
            --resource-group "${{ vars.AZURE_GRUPO }}" \
            --name "reservas-${GITHUB_RUN_NUMBER}" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/main.bicepparam \
            --query properties.outputs.url.value --output tsv)
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comprobar que responde
        run: |
          # Con escalado a cero, la primera petición despierta la réplica: se espera hasta 3 minutos
          for i in $(seq 1 36); do
            if curl -fsS "${{ steps.despliegue.outputs.url }}/health"; then exit 0; fi
            sleep 5
          done
          echo "La API no responde en ${{ steps.despliegue.outputs.url }}/health" && exit 1
